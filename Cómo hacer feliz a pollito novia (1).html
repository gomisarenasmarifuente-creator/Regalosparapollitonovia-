<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf6ef;--card:#fff;--text:#2b2220;--muted:#7a6a64;--red:#c0392b;--green:#2f6b4f;--line:#eadfd3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1514;--card:#271e1c;--text:#f3e9e4;--muted:#b3a199;--red:#e5604f;--green:#6cbf98;--line:#3a2e2b}}
:root[data-theme="dark"]{--bg:#1b1514;--card:#271e1c;--text:#f3e9e4;--muted:#b3a199;--red:#e5604f;--green:#6cbf98;--line:#3a2e2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.stats{text-align:center;max-width:480px;margin:0 auto 22px;color:var(--muted);font:italic 15px/1.5 Georgia,serif}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.item.done{opacity:.55}
.item.done .name{text-decoration:line-through}
.body{flex:1;min-width:0}
.name{font-weight:bold;font-size:1.05rem;overflow-wrap:anywhere}
.meta{font:14px system-ui,sans-serif;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font:12px system-ui,sans-serif;padding:1px 8px;border-radius:99px;background:var(--line);margin-right:6px}
.tag.alta{background:var(--red);color:#fff}
a.btn,button{font:14px system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
form{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:20px 0;display:grid;gap:8px}
input,select{font:15px system-ui,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--muted);padding:24px}
.hint{font:13px system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:16px}
.lights{display:flex;justify-content:space-around;border-top:2px solid var(--green);margin:0 6px;position:relative;z-index:1}
.lights span{width:12px;height:17px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;margin-top:-1px;animation:tw 2s ease-in-out infinite}
.lights span:nth-child(4n+1){background:#e74c3c;box-shadow:0 0 8px #e74c3c}
.lights span:nth-child(4n+2){background:#f1c40f;box-shadow:0 0 8px #f1c40f;animation-delay:.5s}
.lights span:nth-child(4n+3){background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation-delay:1s}
.lights span:nth-child(4n){background:#3498db;box-shadow:0 0 8px #3498db;animation-delay:1.5s}
@keyframes tw{50%{opacity:.35}}
.snow span{position:fixed;top:-24px;left:var(--l);font-size:18px;opacity:.7;pointer-events:none;z-index:0;animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
main{position:relative;z-index:1}
.chick{display:block;margin:4px auto 0;width:230px;max-width:70%;height:auto;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.chick,.snow span,.lights span{animation:none}}
h1{font-family:'Mountains of Christmas','Brush Script MT','Segoe Script',cursive}
h1{color:var(--red);font-size:2.4rem;line-height:1.15;font-weight:700}
.sub{font-size:1.1rem;font-family:Georgia,'Times New Roman',serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:2px}
.cat:hover{border-color:var(--red)}
.ce{font-size:2rem;line-height:1;display:block}.ce svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto 4px}.cn{font-weight:bold}.cc{font:13px system-ui,sans-serif;color:var(--muted)}
.back{font:14px system-ui,sans-serif;color:var(--red);text-decoration:none}
h2{margin:8px 0 14px;font-size:1.5rem}
.photo{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.fl{font:14px system-ui,sans-serif;color:var(--muted);display:grid;gap:4px}
.intro{background:var(--card);border:1px dashed var(--red);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-style:italic}
.grid .cat:last-child:nth-child(odd){grid-column:1/-1}
.mine{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 16px;font:14px/1.7 system-ui,sans-serif}
</style>

  f.innerHTML='<strong>Añadir regalo</strong><input name="name" placeholder="¿Qué te gustaría?" required><select name="cat">'+opts+'</select><input name="link" placeholder="Enlace (opcional)" type="url"><div class="row"><input name="price" placeholder="Precio en € (opcional)" inputmode="decimal"><select name="prio"><option value="normal">Prioridad normal</option><option value="alta">Me hace mucha ilusión</option></select></div><input name="note" placeholder="Nota: talla, color… (opcional)">'+(assets?'<label class="fl">Foto (opcional)<input name="foto" type="file" accept="image/*"></label>':'')+'<button class="primary" type="submit">Añadir a la lista</button>';
  f.onsubmit=async function(e){e.preventDefault();var v=new FormData(f),imgId='',file=v.get('foto'),btn=f.querySelector('button.primary');if(file&&file.size&&assets){btn.disabled=true;btn.textContent='Subiendo foto…';try{var blob;try{blob=await shrink(file)}catch(er){blob=file}var up=await assets.upload(blob);imgId=up.id}catch(err){}}
    state.items.push({id:String(Date.now()),cat:v.get('cat'),name:v.get('name').trim(),link:v.get('link').trim(),price:v.get('price').replace(',','.').trim(),note:v.get('note').trim(),prio:v.get('prio'),img:imgId,done:false});
    changed();f.reset()};
  admin.appendChild(f);
}
function changed(){
  render();renderAdmin();
  if(!artifact)return;
  clearTimeout(timer);
  timer=setTimeout(function(){
    var c=document.documentElement.cloneNode(true);
    c.querySelector('#data').textContent=JSON.stringify(state);
    c.querySelector('#app').innerHTML='';c.querySelector('#admin').innerHTML='';c.querySelector('#stats').innerHTML='';
    artifact.publish('<!doctype html>\n'+c.outerHTML).catch(function(){});
  },800);
}
window.addEventListener('hashchange',function(){render();renderAdmin();window.scrollTo(0,0)});
render();
(async function(){
  try{
    if(window.claude&&claude.use){
      var u=await claude.use('user');
      isOwner=!!(u&&u.isOwner());
      if(isOwner){artifact=await claude.use('artifact');if(!artifact)isOwner=false;else assets=await claude.use('assets')}
      if(!isOwner)await loadBought();
      ready=true;
      render();renderAdmin();
    }
  }catch(e){}
})();
})();
</script>
